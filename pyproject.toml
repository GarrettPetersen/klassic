[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "klassic"
version = "0.1.0"
description = "Transcript-driven limited-animation interview production"
requires-python = ">=3.11"
dependencies = ["Pillow==12.1.1"]

[project.scripts]
klassic = "klassic.cli:main"

[tool.setuptools.packages.find]
include = ["klassic*"]
